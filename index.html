};
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');
function hud(){$('#mo').textContent='R$ '+G.money;$('#rp').textContent='❤️ '+Math.max(0,Math.round(G.rep));$('#tm').textContent='🕖 '+hm(G.clk)+(G.open?' · aberto':' · fechado');IT.forEach((a,i)=>$('#sk'+i).textContent=G.st[i])}
const mood=(c,m)=>{if(c.m!==m){c.m=m;c.g.userData.f.material=FM[m]}};
function spawn(){const fr=[0,1,2].filter(i=>!G.cu.some(c=>c.slot===i));if(!fr.length)return;const slot=pick(fr),want=Math.random()*4|0,g=person();g.position.set(4,0,8.7);
const b=new THREE.Sprite(EM[want]);b.scale.set(.7,.7,1);b.position.y=2.1;g.add(b);const br=new THREE.Sprite(new THREE.SpriteMaterial({color:0x5FD08F}));br.scale.set(.7,.09,1);br.position.y=2.55;g.add(br);
const mx=Math.max(20,28-(G.clk-480)/40);G.cu.push({g,st:'in',want,slot,pat:mx,max:mx,b,br})}
function serve(i){if(!G.on||G.pz)return;const w=G.cu.filter(c=>c.st=='wait'&&c.want==i).sort((a,b)=>a.pat-b.pat)[0];
if(!w){toast('Ninguém pediu isso agora');return}
if(G.st[i]<=0){toast('Acabou! Reponha no 💻 Estoque (lado direito ▶)');return}
G.st[i]--;shelf(i);w.st='ready';w.pat=w.max;w.b.material=EM[6];w.br.visible=false;mood(w,1);toast('Item entregue! Agora receba no caixa 💵 (lado esquerdo ◀)');hud()}
function aim(){const m=G.mo;if(!m)return 9;const t=Math.atan2(-(4.8-PX),-11.7);let d=(yaw-t)%(2*Math.PI);if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;return Math.abs(d)}
function deliver(){if(!G.on||G.pz)return;const m=G.mo;if(!m||m.st!='wait'){toast('Nenhum motoboy esperando');return}
if(aim()>.4){toast('Olhe para o motoboy na porta! 👈');return}
G.money+=30;G.rep=Math.min(100,G.rep+3);G.srv++;m.st='go';toast('📦 Pedido entregue ao motoboy! +R$ 30');hud()}
function pn(h){$('#pn').innerHTML=h;$('#ov').style.display='grid'}
function closePn(){$('#ov').style.display='none';G.pz=0}
function openPC(){if(PX>-1.8){toast('Ande ▶ até o computador 💻, no lado direito do balcão');return}G.pz=1;pn('<h1>💻 Estoque</h1><p>Peça reposição ao fornecedor. Chega em alguns segundos.</p>'+IT.map((a,i)=>{const n=G.pd.filter(p=>p.i==i).length*6;return `<p>${a[0]} ${a[1]}: <b>${G.st[i]}</b> na loja${n?' (+'+n+' a caminho 🚚)':''}<br><button class="cb" onclick="buy(${i})">Comprar 6 · R$ ${a[3]*6}</button></p>`}).join('')+'<button class="go" onclick="closePn()">Fechar</button>')}
function buy(i){const c=IT[i][3]*6;if(G.money<c){toast('Dinheiro insuficiente');return}G.money-=c;G.pd.push({i,t:10});hud();openPC()}
function cashUI(){const c=G.cu.find(c=>c.st=='pay');if(!c)return;const bill=IT[c.want][2];G.pz=1;G.pc={c,t:0,bill,paid:pick([10,20,50].filter(v=>v>bill))};drawCash()}
function drawCash(){const p=G.pc;pn(`<h1>💵 Caixa</h1><p>Conta: <b>R$ ${p.bill}</b> · Cliente pagou: <b>R$ ${p.paid}</b></p><p>Monte o troco:</p><div>${[1,2,5,10,20].map(v=>`<button class="cb" onclick="G.pc.t+=${v};drawCash()">R$ ${v}</button>`).join('')}</div><p style="font-size:26px">Troco dado: <b>R$ ${p.t}</b></p><button class="cb" onclick="G.pc.t=0;drawCash()">Limpar</button><br><button class="go" onclick="give()">Dar o troco</button>`)}
function give(){const p=G.pc,c=p.c,need=p.paid-p.bill;c.st='out';c.b.visible=false;
if(p.t==need){G.money+=p.bill;G.rep=Math.min(100,G.rep+2);G.srv++;mood(c,1);toast('Troco certo! Cliente feliz 😊 +R$ '+p.bill)}
else if(p.t>need){G.money+=p.bill-(p.t-need);G.srv++;mood(c,1);toast('Você deu R$ '+(p.t-need)+' a mais 😅')}
else{G.money+=p.bill;G.rep-=6;G.lost++;mood(c,2);toast('Troco menor! Cliente bravo 😠')}
closePn();hud()}
function mv(o,tx,tz,s,dt){const dx=tx-o.position.x,dz=tz-o.position.z,d=Math.hypot(dx,dz);if(d<.06){if(o.userData.walk){o.userData.walk=false;o.userData.legs?.forEach(l=>l.rotation.x=0)}return 1}
 const k=Math.min(1,s*dt/d);o.position.x+=dx*k;o.position.z+=dz*k;o.rotation.y=Math.atan2(dx,dz);o.userData.walk=true;
 const ph=T*9+(o.userData.phase||0);if(o.userData.legs){o.userData.legs[0].rotation.x=Math.sin(ph)*.48;o.userData.legs[1].rotation.x=-Math.sin(ph)*.48;o.userData.arms[0].rotation.x=-Math.sin(ph)*.38;o.userData.arms[1].rotation.x=Math.sin(ph)*.38}
 o.position.y=Math.abs(Math.sin(ph*2))*.018;return 0}
function leave(c,m,why){c.st='out';c.br.visible=false;c.b.material=EM[5];mood(c,m);G.rep-=8;G.lost++;toast(why)}
function lightingCycle(){
 const day=Math.max(0,Math.min(1,(G.clk-360)/840));
 const sun=Math.max(0,Math.sin((G.clk/1440)*Math.PI*2-Math.PI/2));
 const night=1-Math.max(0,Math.min(1,sun*1.35));
 const sky=new THREE.Color(0x9cc9e8),dusk=new THREE.Color(0xf19a68),dark=new THREE.Color(0x101a35);
 let skyMix=sky.clone().lerp(dusk,Math.max(0,1-Math.abs(G.clk-1080)/150)*.72).lerp(dark,night*.94);
 sc.background=skyMix;sc.fog.color.copy(skyMix);
 dl.intensity=.12+sun*1.25;dl.color.setHSL(.10,.48,.62+sun*.18);dl.position.set(Math.cos(G.clk/1440*Math.PI*2)*18,4+sun*18, -8);
 hemi.intensity=.22+sun*.9;
 interiorLights.forEach(l=>{l.intensity=.35+night*1.7;l.color.set(night>.5?0xffb76b:0xffe0b3)});
 rd.toneMappingExposure=.72+sun*.38+night*.12;
}
function update(dt){T+=dt;lightingCycle();
runners.forEach((r,i)=>{r.position.x+=4*dt;if(r.position.x>26)r.position.x=-26;r.position.y=Math.abs(Math.sin(T*10+i))*.1;r.rotation.y=Math.PI/2});
gym.forEach(([g,s],i)=>{g.position.y=Math.abs(Math.sin(T*3*s+i))*.4;g.rotation.y=T*s});
// jogador
const dir=(KY.r?1:0)-(KY.l?1:0),forward=(KY.forward?1:0)-(KY.back?1:0);
 if(!G.pz){const speed=3.0;PX=Math.max(-4.8,Math.min(4.8,PX+Math.sin(yaw)*forward*speed*dt+Math.cos(yaw)*dir*speed*dt));cam.position.z+=Math.cos(yaw)*forward*speed*dt-Math.sin(yaw)*dir*speed*dt;cam.position.z=Math.max(-1.6,Math.min(7.0,cam.position.z));}
if(KY.u&&PY==0&&!G.pz)VY=4.6;PY+=VY*dt;VY-=13*dt;if(PY<=0){PY=0;VY=0}CR+=((KY.d?1:0)-CR)*Math.min(1,12*dt);
const pcB=PX<-2,cp=G.cu&&G.cu.find(c=>c.st=='pay'),wm=G.mo&&G.mo.st=='wait';
$('#pc').style.display=G.on?'block':'none';$('#cx').style.display=G.on&&cp&&PX>1.6?'block':'none';$('#dl').style.display=G.on&&wm?'block':'none';$('#dl').classList.toggle('ok',wm&&aim()<.4);
if(!G.on||G.pz)return;
G.clk+=dt*3.6;
if(!G.open&&G.clk>=480&&G.clk<1080){G.open=1;SO.visible=true;SF.visible=false;toast('🔓 Loja aberta! Bom trabalho!')}
if(G.open&&G.clk>=1080){G.open=0;SO.visible=false;SF.visible=true;toast('🔒 Hora de fechar! Atenda quem já está na loja')}
G.pd.forEach(p=>p.t-=dt);G.pd.filter(p=>p.t<=0).forEach(p=>{G.st[p.i]=Math.min(24,G.st[p.i]+6);shelf(p.i);toast('🚚 Reposição no balcão: '+IT[p.i][0]+' '+IT[p.i][1]+' · '+G.st[p.i]+' unidades');});G.pd=G.pd.filter(p=>p.t>0);
if(G.open){G.sp-=dt;const rush=(G.clk>720&&G.clk<810)||(G.clk>1000);if(G.sp<=0){spawn();G.sp=(rush?5.5:8.5)+Math.random()*2.5}}
for(const c of G.cu){const r=c.pat/c.max;
if(c.st=='in'){if(mv(c.g,SX[c.slot],1.7,2.5,dt)){c.st='wait';c.g.rotation.y=Math.PI;c.g.position.y=0}}
else if(c.st=='wait'){c.pat-=dt;c.br.scale.x=Math.max(.02,.7*r);c.br.material.color.set(r>.5?0x5FD08F:r>.25?0xF2C230:0xE74C3C);mood(c,r>.55?0:r>.25?3:2);if(c.pat<=0)G.st[c.want]<=0?leave(c,4,'😢 Cliente triste: o item acabou!'):leave(c,2,'😠 Cliente desistiu e foi embora!')}
else if(c.st=='ready'){if(!G.cu.some(o=>o.st=='toC'||o.st=='pay')){c.st='toC';c.slot=-1}}
else if(c.st=='toC'){if(mv(c.g,3.1,1.7,2.4,dt)){c.st='pay';c.g.rotation.y=Math.PI;c.g.position.y=0;c.pat=c.max;c.br.visible=true;c.b.material=EM[6]}}
else if(c.st=='pay'){c.pat-=dt;c.br.scale.x=Math.max(.02,.7*c.pat/c.max);mood(c,c.pat/c.max>.5?1:c.pat/c.max>.25?3:2);if(c.pat<=0)leave(c,2,'😠 Cliente cansou de esperar no caixa!')}
else if(mv(c.g,4,8.7,2.8,dt)){sc.remove(c.g);c.dead=1}}
G.cu=G.cu.filter(c=>!c.dead);
if(!G.mo){G.mt-=dt;if(G.mt<=0&&G.open){G.mo={g:moto(),st:'in',w:15};G.mo.g.position.set(26,0,10.4)}}
else{const m=G.mo,g=m.g;if(m.st=='in'){g.position.x-=9*dt;if(g.position.x<=4.8){g.position.x=4.8;m.st='wait';toast('🏍️ Motoboy chegou! Olhe para a porta e entregue')}}
else if(m.st=='wait'){m.w-=dt;if(m.w<=0){m.st='go';G.rep-=10;G.lost++;toast('Motoboy foi embora sem o pedido!')}}
else{g.position.x-=9*dt;if(g.position.x<-28){sc.remove(g);G.mo=null;G.mt=22+Math.random()*10}}}
let h='Arraste para olhar · WASD / setas para andar · espaço para pular · ⬇ agachar';
if(!G.open&&G.clk<480)h='Abre às 08:00 · ande ▶ até o 💻 e confira o estoque';else if(cp)h='Cliente no caixa 💵: ande ◀ até o caixa e toque em Receber';else if(wm)h=aim()<.4?'Toque em Entregar 📦':'Motoboy na porta: olhe para a esquerda 👈';
$('#hint').textContent=h;hud();
if(G.clk>=1080&&!G.cu.length&&!G.mo||G.clk>=1120||G.rep<=0)end()}
function end(){G.on=0;const t=G.srv+G.lost,sla=t?Math.round(100*G.srv/t):0,s=G.money+Math.max(0,G.rep)*2,rk=s>=700?['🥇','Mestre de Ouro']:s>=450?['🥈','Gerente de Prata']:['🥉','Padeiro Aprendiz'];
['dl','cx','pc'].forEach(i=>$('#'+i).style.display='none');
pn(`<div style="font-size:60px">${rk[0]}</div><h1>${rk[1]}</h1><p>Caixa final: <b>R$ ${G.money}</b> · <b>${G.srv}</b> atendimentos</p><p>Reputação ${Math.max(0,Math.round(G.rep))} · Cumprimento de SLA <b>${sla}%</b></p><p>${G.rep<=0?'A reputação acabou antes do fim do dia.':'Dia encerrado: a loja fechou às 18:00!'}</p><button class="go" onclick="start()">Jogar de novo</button>`)}
function start(){if(G.cu)G.cu.forEach(c=>sc.remove(c.g));if(G.mo)sc.remove(G.mo.g);G={on:1,pz:0,clk:420,open:0,money:100,rep:100,srv:0,lost:0,cu:[],mo:null,mt:25,sp:3,st:[8,8,8,8],pd:[]};PX=0;cam.position.z=-1.3;SO.visible=false;SF.visible=true;[0,1,2,3].forEach(shelf);$('#ov').style.display='none';hud()}
G={on:0,clk:420,money:100,rep:100,cu:[],st:[8,8,8,8],pd:[]};[0,1,2,3].forEach(shelf);hud();
let AC,MG,MU=1;
function music(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.13;MG.connect(AC.destination);
const N=[261.63,293.66,329.63,392,440,523.25,587.33],CH=[[130.81,164.81,196],[110,130.81,164.81],[87.31,130.81,174.61],[98,123.47,146.83]];let st=0;
const note=(f,t,d,v,ty)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.1)};
const bar=()=>{const t=AC.currentTime+.05;CH[st++%4].forEach(f=>note(f,t,4.2,.3,'sine'));for(let i=0;i<4;i++)if(Math.random()<.7)note(pick(N),t+i,1.8,.22,'triangle')};
bar();setInterval(bar,4000)}
function mute(){MU=!MU;if(MG)MG.gain.value=MU?.13:0;$('#mu').textContent=MU?'🔊':'🔇'}
function intro(){pn(`<div style="font-size:64px">🥖</div><h1>Pão de Ouro</h1><p>Padaria · Nutrição · Performance</p><p>Ambiente 3D aprimorado · iluminação dinâmica · personagens animados</p><p>Jogo de gestão em primeira pessoa<br>Desenvolvido por <b>João Ricardo</b></p><button class="go" onclick="entrar()">Entrar</button>`)}
function entrar(){music();pn(`<h1>Seu dia na padaria</h1><p>Você começa às 07:00 e a loja <b>abre às 08:00</b>. Antes, ande ▶ até o <b>💻 Estoque</b> (lado direito do balcão) e confira as prateleiras.</p><p>Cliente pediu algo? <b>Toque no item</b>. Ele vai ao <b>caixa 💵</b> (lado esquerdo, perto da porta): receba e <b>monte o troco</b>. As prateleiras esvaziam conforme vende: reponha no computador.</p><p>Motoboy na porta? Olhe para ele e entregue. A loja <b>fecha às 18:00</b>.</p><p style="font-size:16px">WASD / setas para andar · espaço para pular · arraste para olhar · teclas 1–4 e E</p><button class="go" onclick="start()">Abrir o dia</button>`)}
intro();
// controles
let dr=null;const cv=$('#gl');
cv.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dr)return;yaw+=(e.clientX-dr[0])*.005;pit=Math.max(-.7,Math.min(.7,pit+(e.clientY-dr[1])*.005));dr=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',()=>dr=null);
const KM={ArrowLeft:'l',ArrowRight:'r',ArrowDown:'d',ArrowUp:'u',' ':'u',a:'l',d:'r',s:'back',w:'forward',A:'l',D:'r',S:'back',W:'forward'};
addEventListener('keydown',e=>{if(KM[e.key]){KY[KM[e.key]]=1;e.preventDefault()}if(e.key>='1'&&e.key<='4')serve(+e.key-1);if(e.key=='e'){if($('#dl').style.display=='block'&&aim()<.4)deliver();else if($('#cx').style.display=='block')cashUI();else if($('#pc').style.display=='block')openPC()}});
addEventListener('keyup',e=>{if(KM[e.key])KY[KM[e.key]]=0});
document.querySelectorAll('.pd').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{KY[k]=1;e.stopPropagation()});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>KY[k]=0))});
function rs(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);const moving=(!G.pz&&(KY.l||KY.r||KY.forward||KY.back))?1:0;
 const bob=moving?Math.sin(T*11)*.035:Math.sin(T*1.4)*.006;
 cam.position.x=PX;cam.position.y=1.62-.6*CR+PY+bob;cam.rotation.y=yaw;cam.rotation.x=pit+(moving?Math.sin(T*5.5)*.008:0);rd.render(sc,cam);requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
